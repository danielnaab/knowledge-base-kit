apiVersion: kb/v1
name: graft-project-example
description: "Tool project KB (architecture + project management) with canonical interface + decisions."

entrypoints:
  human: docs/README.md
  agent: docs/agents.md

meta:
  entrypoint: "https://forgejo.example/your-org/meta-knowledge-base/src/branch/main/docs/meta.md"

imports:
  - kind: git
    repo: https://forgejo.example/your-org/meta-knowledge-base.git
    ref: main
    entrypoint: meta.yaml

paths:
  docs: docs
  notes: notes

sources:
  canonical:
    - path: docs/interface.md
      note: "Interface contract is canonical for this KB."
    - path: docs/decisions/**
      note: "Decisions are canonical for tradeoffs."

rules:
  lifecycle:
    statuses: ["draft", "working", "stable", "deprecated"]
  provenance:
    requiredFor: ["factual-claims", "operational-guidance"]
  writes:
    allow: ["docs/**", "notes/**"]
    deny: ["secrets/**", "prod/**"]
