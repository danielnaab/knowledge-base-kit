apiVersion: kb/v1
name: team-handbook-example
description: "Team handbook using curated docs strategy - single entrypoint for onboarding."

entrypoints:
  human: docs/README.md
  agent: AGENTS.md

meta:
  entrypoint: "https://forgejo.example/your-org/meta-knowledge-base/src/branch/main/docs/meta.md"

imports:
  - kind: git
    repo: https://forgejo.example/your-org/meta-knowledge-base.git
    ref: main
    entrypoint: knowledge-base.yaml

paths:
  docs: docs

rules:
  lifecycle:
    statuses: ["draft", "working", "stable", "deprecated"]
  provenance:
    requiredFor: ["factual-claims", "operational-guidance"]
  writes:
    allow: ["docs/**"]
    deny: ["secrets/**"]
