apiVersion: kb/v1
name: research-notes-example
description: "Research notes using atomic notes strategy - many small notes with map-of-content index."

entrypoints:
  human: docs/README.md
  agent: AGENTS.md

meta:
  entrypoint: "https://forgejo.example/your-org/meta-knowledge-base/src/branch/main/README.md"

imports:
  - kind: git
    repo: https://forgejo.example/your-org/meta-knowledge-base.git
    ref: main
    entrypoint: knowledge-base.yaml

paths:
  docs: docs
  notes: notes

rules:
  lifecycle:
    statuses: ["draft", "working", "stable", "deprecated"]
  provenance:
    requiredFor: ["factual-claims"]
  writes:
    allow: ["docs/**", "notes/**"]
    deny: ["secrets/**"]
