apiVersion: meta-kb/v1
name: meta-knowledge-base
version: 0.5.0

# For tooling: treat this as the only stable doc entrypoint.
stable:
  entrypointDoc: docs/meta.md

entrypoints:
  human: docs/meta.md
  agent: docs/meta.md

provides:
  strategiesDir: docs/strategies
  policiesDir: docs/policies
  playbooksDir: docs/playbooks
  starterKitsDir: starter-kits
  examplesDir: examples
  adaptersDir: adapters

composition:
  precedence: domain-over-pack
  mergeStrategy: deep-merge
