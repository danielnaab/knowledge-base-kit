# managed by tuteur: https://github.com/danielnaab/tuteur (delete this line to keep your own edits)
# tuteur's upgrade bot, run by the repo itself: weekly, move tuteur's own pin and the patterns pinned to
# a tag to the newest tag upstream, and propose the change as a PR from the branch patterns/upgrade.
# Nothing is pushed to the default branch: review and merge are yours. Copy to .forgejo/workflows/.
# The steps are `nix run .#tuteur ci upgrade|pr` (tuteur's lib/ci.sh) at the tuteur version the
# repo pins, and `tuteur upgrade` replaces this file with the copy each new version ships, as long as
# the line above is here.
name: tuteur-upgrade
on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:

concurrency:
  group: tuteur-upgrade
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    sandbox = false
  BRANCH: patterns/upgrade

jobs:
  # Upgrade, check and push. An upgrade of tuteur itself runs the new version's code here (its
  # check), and the repo's own checks run over the new patterns, all
  # before review, so this job is given no secret: only the job token. If `nix flake check` fails
  # the branch is still pushed (its commit names the failing checks) and this job fails. It also
  # deletes tuteur/upgrade, the branch before tuteur 0.3.0, when this job wrote it (its PR closes).
  upgrade:
    runs-on: nixos-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.upgrade.outputs.changed }}
    steps:
      - name: Checkout the default branch
        env:
          SERVER: ${{ github.server_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "$REPO_URL.git"
          # The token is for this server only (scoped), never for the providers tuteur-upgrade asks.
          git config "http.$SERVER/.extraheader" "Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git fetch -q --no-tags origin "$REF"
          git checkout -q --force -B "$BRANCH" FETCH_HEAD

      - name: Upgrade, check the result, push it to patterns/upgrade
        id: upgrade
        run: |
          # tuteur's flake: beside the patterns folder, the one folder whose README.md carries tuteur's
          # marker (git grep doesn't look inside submodules), or the top when there is none yet.
          # Bash and git only: the nixos/nix image has no sed.
          rs=$(git grep -l -F -e '<!-- managed by tuteur: https://github.com/danielnaab/tuteur -->' -- '*/README.md' || true)
          case $rs in *$'\n'*) echo "::error::two patterns folders:" $rs "tuteur supports one per repository"; exit 1 ;; esac
          sd=${rs%/README.md} fd=. flake=.
          if [[ $sd == */* ]]; then fd=${sd%/*}; fi
          if [ "$fd" != . ]; then
            flake=path:$PWD/$fd
            # a path: flake reads the patterns from the working tree: fill them (a git flake's Nix
            # fetches them itself, at the commits the checkout records)
            git submodule update -q --init --recursive -- "$sd"
          fi
          nix run "$flake#tuteur" ci upgrade

  # Open the PR (or retitle the open one, which the push updated), saying what changed upstream
  # and whether the checks passed. A fresh job, checked out at the default branch: it runs the
  # tuteur that branch pins and never evaluates the upgraded flake, so the PR token never meets
  # code nobody has reviewed yet. It runs when the upgrade job pushed, even if its checks failed.
  pr:
    needs: upgrade
    if: ${{ !cancelled() && needs.upgrade.outputs.changed == 'true' }}
    runs-on: nixos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the default branch
        env:
          SERVER: ${{ github.server_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "$REPO_URL.git"
          git config "http.$SERVER/.extraheader" "Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git fetch -q --no-tags origin "$REF"
          git checkout -q --force --detach FETCH_HEAD

      - name: Open (or update) the PR
        env:
          WEB: ${{ github.server_url }}/${{ github.repository }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          # The job token can push, but Forgejo (through 11 at least) refuses it when opening a PR
          # on a private repo. A user's token, in the Actions secret TUTEUR_PR_TOKEN (or graft's GRAFT_PR_TOKEN,
          # still read; set it once for all your repos under Settings > Actions > Secrets), opens the PR as
          # that user.
          PR_TOKEN: ${{ secrets.TUTEUR_PR_TOKEN || secrets.GRAFT_PR_TOKEN || github.token }}
        run: |
          # tuteur's flake: beside the patterns folder, the one folder whose README.md carries tuteur's
          # marker (git grep doesn't look inside submodules), or the top when there is none yet.
          # Bash and git only: the nixos/nix image has no sed.
          rs=$(git grep -l -F -e '<!-- managed by tuteur: https://github.com/danielnaab/tuteur -->' -- '*/README.md' || true)
          case $rs in *$'\n'*) echo "::error::two patterns folders:" $rs "tuteur supports one per repository"; exit 1 ;; esac
          sd=${rs%/README.md} fd=. flake=.
          if [[ $sd == */* ]]; then fd=${sd%/*}; fi
          if [ "$fd" != . ]; then
            flake=path:$PWD/$fd
          fi
          nix run "$flake#tuteur" ci pr
